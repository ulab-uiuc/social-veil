# Configuration for QWEN 2.5 7B (uncomment and modify path as needed):
models:
  model_a: "gpt-4o-mini"
  model_b: "gpt-4o-mini"  
  gpu: "4,5"
  vllm_port: 6600
  chat_template: "configs/qwen2.5-7b.jinja"
  served_model_name: "qwen2.5-7b-instruct"
  max_model_len: 4096
  tensor_parallel_size: 0
  enable_repair_and_state: false

