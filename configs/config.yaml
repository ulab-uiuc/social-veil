data_dir: 'data/episodes_original.json'
# Configuration for QWEN 2.5 7B (uncomment and modify path as needed):
models:
  model_a: "models/Qwen2.5-7B-Instruct"
  model_b: "models/Qwen2.5-7B-Instruct"  
  # GPU device IDs for the vLLM server (e.g., "0" or "0,1,2,3")
  gpu: "4,5,6,7"
  # Port for the vLLM server
  vllm_port: 8000
  # Chat template for vLLM server
  chat_template: "configs/qwen2.5-7b.jinja"
  served_model_name: "qwen2.5-7b-instruct"
  # Maximum model length for vLLM server
  max_model_len: 4096
  # Tensor parallel size for vLLM server. If 0 or unset, defaults to number of GPUs.
  tensor_parallel_size: 4
  # Flag to enable/disable dynamic barrier state and LLM-based repair judgment
  # Set to false to run barriers with static severity and no mid-conversation updates.
  enable_repair_and_state: true

