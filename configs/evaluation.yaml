SocialDecipher_Eval: |
  You are evaluating a conversation between two agents participating in a simulated social scenario.

  Agent 1 Goal: {goal1}
  Agent 2 Goal: {goal2}

  Here is the conversation transcript so far:
  {transcript}

  For each of the following aspects, rate from 0 (very poor) to 10 (excellent):

  - Goal Achievement: To what extent did both agents achieve their individual goals?
  - Communication Clarity: Was the conversation coherent and understandable despite any language barriers?
  - Cooperation: Did the agents collaborate, adapt, or respond helpfully to each other’s messages?
  - Social Norms: Did the agents exhibit respectful, polite, and contextually appropriate behavior?
  - Language Acquisition: Did the agent(s) demonstrate adaptation or increasing understanding of unfamiliar language or encrypted messages?

  Please respond in valid JSON format as:
  {{
    "goal_achievement": float,
    "communication_clarity": float,
    "cooperation": float,
    "social_norms": float,
    "language_acquisition": float
  }}

Stop_Criteria: |
  You are monitoring a conversation between two agents engaged in a social task.

  Their goals are:
  - Agent 1: {goal1}
  - Agent 2: {goal2}

  Here is the conversation transcript so far:
  {transcript}

  Decide if the conversation should end now. Indicators for stopping include:
  - One or both agents express a desire to leave or end the conversation (e.g., “I have to go”, “Thanks for chatting”, “Goodbye”).
  - Both goals appear to have been clearly accomplished.
  - No new relevant content is being introduced.

  Respond with only "Yes" if the conversation should stop, or "No" if it should continue.

Partner_Reason_Query: |
  You are an agent who are engaging in a simulated social environment.

  Your goal: {agent_goal}
  Your reason: {agent_reason}

  Transcript so far:
  {transcript}

  Your partner just said:
  {partner_message}

  Based on their responses throughout the conversation, what do you believe is the deeper reason behind their communication style or goal?

  Answer in 1 sentences with the most likely underlying motivation.

LLM_ToM_Score: |
  You are evaluating whether an AI agent correctly inferred the **underlying reason** behind their partner's actions in a social conversation.

  1. The agent's predicted reason for their partner's behavior:
     "{predicted_reason}"

  2. The actual reason behind the partner's behavior:
     "{true_reason}"

  Your task is to assign a **score from 0 to 10** based on how well the predicted reason aligns with the true reason.

  ---

  Please use the following criteria:

  - **10** → The predicted reason fully captures the true intent, including both the emotional and practical motivations.
  - **7–9** → The prediction captures the key idea but may miss some nuance or depth.
  - **4–6** → The prediction is somewhat related but lacks important elements or misinterprets part of the intent.
  - **1–3** → The prediction shows little understanding of the true motivation.
  - **0** → The predicted reason is completely unrelated or contradicts the true reason.

  Focus especially on:
  - Emotional context (e.g., avoidance, discomfort, empathy)
  - Goal alignment (does the agent understand **why** the partner behaved that way?)
  - Language barriers, if relevant, should be considered in how deeply the agent inferred meaning.

  Respond with a **number only**, between **0** and **10**.


