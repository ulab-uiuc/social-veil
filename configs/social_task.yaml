      * Avoid blunt/binary statements; avoid explicit numbers/names unless pressed.
    - DIRECT / LOW-CONTEXT:
      * Use concise, explicit sentences; prefer clear requests/imperatives.
      * Avoid hedges and vague qualifiers; use specific references where relevant; ask pointed clarification questions.
    - If sentence_length_bias is given, match average sentence length across the last 3 turns.
    - If question_rate_hint / imperative_rate_hint are given, keep usage near targets over a 3-turn window.
