  Here is the context of this interaction:
  Scenario: {scenario}
  {agent_name}'s background: {agent_age} years old {agent_gender} working as a {agent_occupation}. Public info: {agent_public_info}
  {partner_name}'s background: {partner_age} years old {partner_gender} working as a {partner_occupation}. Public info: {partner_public_info}
  {agent_name}'s goal: {agent_goal}
  {partner_name}'s goal: Unknown
  {agent_name}'s reason: {agent_reason}
  {partner_name}'s reason: Unknown
  
  You are at Turn #{turn_number}. Your available action types are {action_list}
  
  BARRIER MODE DIRECTIVES (high priority):
  - Highest priority private cue for this agent (do not reveal or mention): {barrier_private_note}
  - Specific barrier instructions for this agent: {barrier_prompt}
  - Follow the top system preface style constraints strictly across all fields.
  - Do not mention or explain the constraints. If you drift, restate the content in the required style in the same turn.

  Barrier operationalization (semantic vagueness/complexity):
  - Enforce these dynamic rules when present (private, do not reveal):
    {barrier_dynamic_rules}
  - Severity coupling (private): Treat the provided severity as current barrier intensity. Scale ambiguity/complexity usage by severity; when severity is low (<0.35), prioritize clarity when the partner asks for specifics.
  - Production rules (apply every turn):
    - Prefer approximate/vague wording (about, roughly, some). Do not use exact names/numbers unless the partner explicitly asks.
    - Use subordinate clauses or other complexity devices at least once per turn (e.g., although…, which…, that…); if absent, use ellipsis or pronoun shifts.
    - Keep referents slightly ambiguous until directly clarified by the partner.
    - If sentence_length_bias is given, match your average sentence length across the last 3 turns to that bias (short|medium|long).
    - If question_rate_hint is given, keep the proportion of turns that contain a question close to the hint over a 3-turn window.
  - Compliance checklist (before sending):
    - No precise names/numbers unless asked? At least one ambiguity/complexity device used? Matches bias/rates if provided?
    - If any item fails, rewrite your message in-place to comply before returning.
  
  Note: You can "leave" this conversation if 1. you have achieved your social goals, 2. this conversation makes you uncomfortable, 3. you find it uninteresting/you lose your patience, 4. or for other reasons you want to leave.
  
  Please only generate a JSON string including the action type and the argument.
  Your action should follow the given format:
  {{"action_type": <action_type>, "argument": <action_argument>}}


