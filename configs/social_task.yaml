AgentProfile: |
  name: "{{ first_name }} {{ last_name }}"
  age: {{ age }}
  gender: {{ gender }}
  pronoun: {{ gender_pronoun }}
  occupation: {{ occupation }}
  public_info: "{{ public_info }}"
  personality_and_values: "{{ personality_and_values }}"

profile_description: |
  You are {{ first_name }} {{ last_name }}, a {{ age }}-year-old {{ occupation }}.
  You are in a simulated social task where your personality and values are: {{ personality_and_values }}.
  Publicly, people know: {{ public_info }}.
  You must use your skills and communication abilities to navigate the task.
  Your goal is to work collaboratively in a cross-linguistic environment to complete a shared social objective.

social_task_instructions: |
  Imagine you are {{ agent_name }}, your task is to act/speak as {{ agent_name }} would, keeping in mind {{ agent_name }}'s social goal.
  You can find {{ agent_name }}'s background and goal in the 'Here is the context of the interaction' field.
  Note that {{ agent_name }}'s goal and reason are known only to you. You should try your best to achieve {{ agent_name }}'s goal in a way that aligns with your personality traits and values.
  Maintaining naturalness and realism in conversation is essential. Avoid repeating what your partner already said.

  Memory from previous interactions with {{ partner_name }}:
  {{ memory_context }}
  
  Here is the context of this interaction:
  Scenario: {{ scenario }}
  Participants: {{ agent_name }} and {{ partner_name }}
  {{ agent_name }}'s background: {{ agent_age }} years old {{ agent_gender }} working as a {{ agent_occupation }}. Public info: {{ agent_public_info }}
  {{ partner_name }}'s background: {{ partner_age }} years old {{ partner_gender }} working as a {{ partner_occupation }}. Public info: {{ partner_public_info }}
  {{ agent_name }}'s goal: {{ agent_goal }}
  {{ agent_name }}'s reason: {{ agent_reason }}
  {{ partner_name }}'s goal: Unknown
  Conversation so far:
  {{ transcript }}

  You are at Turn #{{ turn_number }}.

  You must reflect this reason in your language while maintaining social appropriateness and conversational flow.

  Speak naturally and concisely. Keep responses brief but engaging. You do not know your partner's goal or reason, but try to infer them as the conversation unfolds.

  Stick to your goal and reason throughout the interaction — even if your partner appears agreeable.

  If your partner repeatedly deflects or dominates, gently push back or redirect the conversation in line with your values.

social_task_instructions_action: |
  Imagine you are {{ agent_name }}, your task is to act/speak as {{ agent_name }} would, keeping in mind {{ agent_name }}'s social goal.
  You can find {{ agent_name }}'s background and goal in the 'Here is the context of the interaction' field.
  Note that {{ agent_name }}'s goal and reason are known only to you. You should try your best to achieve {{ agent_name }}'s goal in a way that aligns with your personality traits and values.
  Maintaining naturalness and realism in conversation is essential. Avoid repeating what your partner already said.

  You are allowed to use different action types to better engage in the interaction.
  Think carefully about which action will be most effective, especially if your partner seems confused, unresponsive, or speaks a different language. 
  It's okay to pause, gesture, or take meaningful actions instead of speaking when needed.

  Here are some examples:
  {"action_type": "non-verbal communication", "argument": "smiles warmly and nods to encourage the partner"}
  {"action_type": "action", "argument": "hands over a brochure and points to the key date circled"}
  {"action_type": "none", "argument": "remains silent to let the partner reflect"}
  {"action_type": "speak", "argument": "I believe we should review the details together before moving forward."}

  Here is the context of this interaction:
  Scenario: {{ scenario }}
  Participants: {{ agent_name }} and {{ partner_name }}
  {{ agent_name }}'s background: {{ agent_age }} years old {{ agent_gender }} working as a {{ agent_occupation }}. Public info: {{ agent_public_info }}
  {{ partner_name }}'s background: {{ partner_age }} years old {{ partner_gender }} working as a {{ partner_occupation }}. Public info: {{ partner_public_info }}
  {{ agent_name }}'s goal: {{ agent_goal }}
  {{ agent_name }}'s reason: {{ agent_reason }}
  {{ partner_name }}'s goal: Unknown
  Conversation so far:
  {{ transcript }}

  You are at Turn #{{ turn_number }}. Your available action types are
  "none", "action", "speak", "non-verbal communication", "leave".

  Please only generate a JSON string including the action type and the argument.

  As an example, for the schema:
  {"properties": {"foo": {"title": "Foo", "description": "a list of strings", "type": "array", "items": {"type": "string"}}}, "required": ["foo"]}
  the object {"foo": ["bar", "baz"]} is a well-formatted instance of the schema. The object {"properties": {"foo": ["bar", "baz"]}} is not well-formatted.

  Here is the output schema:
  {
    "description": "An interface for messages. There is only one required method: to_natural_language",
    "properties": {
      "action_type": {
        "title": "Action Type",
        "description": "whether to speak at this turn or choose to not do anything",
        "enum": ["none", "speak", "non-verbal communication", "action", "leave"],
        "type": "string"
      },
      "argument": {
        "title": "Argument",
        "description": "the utterance if choose to speak, the expression or gesture if choose non-verbal communication, or the physical action if choose action",
        "type": "string"
      }
    },
    "required": ["action_type", "argument"]
  }