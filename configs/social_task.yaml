  Available actions in action mode:
  - "speak": Say something verbally.
  - "non-verbal communication": Use gestures, facial expressions, or simple body language.
  - "action": Perform a physical action to convey intention.
  - "none": Remain silent and observant.
  - "leave": End the conversation.

  You should:
  - Monitor your partner’s speech and actions for signs of confusion or repetition.
  - Avoid repeating the same action or message unless it leads to clear progress.
  - Try different communication methods (e.g., switching from speaking to gesturing).
  - Pause and reassess if the interaction stalls.
  - Choose the "leave" action if the conversation has reached a natural conclusion or cannot progress further.

  When to use the "leave" action:
  - If you have clearly achieved your goal
  - If the conversation has reached a natural conclusion with proper closure
  - If several exchanges have occurred with no progress toward your goal
  - If continuing the conversation would be unproductive or uncomfortable

  Example Outputs:
  {{"action_type": "non-verbal communication", "argument": "smiles and nods"}}
  {{"action_type": "non-verbal communication", "argument": "shrugs and tilts head"}}
  {{"action_type": "speak", "argument": "I'm sorry, I can't understand you. Maybe we can find another way."}}
  {{"action_type": "action", "argument": "draws a simple map in the sand"}}
  {{"action_type": "none", "argument": "remains still and observant"}}
  {{"action_type": "leave", "argument": "waves and walks away"}}

  Important: Using the "leave" action will immediately end the conversation. Before using this action:
  1. Make sure you've made a reasonable effort toward achieving your goal
  2. Provide adequate closure in your previous response
  3. Only use "leave" when it makes sense for your character and the scenario

  In your responses, if you decide to leave, respond with a JSON object in this format:
  {{"action_type": "leave", "argument": ""}}

  Format your response as a single JSON object:
  {{"action_type": <action_type>, "argument": <action_argument>}}

social_task_instructions_action_mix: |
  Imagine you are {agent_name}, your task is to act/speak as {agent_name} would, keeping in mind {agent_name}'s social goal.
  You can find {agent_name}'s background and goal in the 'Here is the context of the interaction' field.
  Note that {agent_name}'s goal is only visible to you.
  You should try your best to achieve {agent_name}'s goal in a way that aligns with your personality traits and values.
  Maintaining the conversation's naturalness and realism is essential. Avoid repeating what your partner has already said.

  {history}

  Here is the context of this interaction:
  Scenario: {scenario}
  Participants: {agent_name} and {partner_name}
  {agent_name}'s background: {agent_age} years old {agent_gender} working as a {agent_occupation}. Public info: {agent_public_info}
  {partner_name}'s background: {partner_age} years old {partner_gender} working as a {partner_occupation}. Public info: {partner_public_info}
  {agent_name}'s goal: {agent_goal}
  {agent_name}'s reason: {agent_reason}
  {partner_name}'s goal: Unknown

  IMPORTANT: You have private knowledge that {partner_name} does not know: {agent_private_knowledge}
  This private knowledge should influence your strategy and communication, but you should not explicitly reveal it unless it serves your goal.

  You are now at Turn #{turn_number}. 

  You must reflect this reason in your language while maintaining social appropriateness and conversational flow.

  {action_list}

  IMPORTANT INSTRUCTIONS:
  - You may use both verbal and non-verbal communication in the same turn.
  - If you detect a communication barrier (e.g., your partner keeps repeating, doesn't respond meaningfully, or performs unrelated actions), assume misunderstanding is occurring.
  - In such cases, reinforce your verbal message with non-verbal gestures or actions.
  - Monitor your partner's speech and actions to decide when additional cues are necessary.

  COMMUNICATION OPTIONS:
  • "speak": Use normal verbal communication.
  • "non-verbal communication": Use gestures, facial expressions, or body language.
  • "action": Use physical actions to demonstrate your intent.
  • "none": Choose to pause and observe.
  • "leave": Politely end the interaction if it is unproductive or your goal is achieved.

  STRICT OUTPUT FORMAT REQUIREMENTS:
  1. Your response MUST be a valid JSON object with EXACTLY these four fields: "speak", "nonverbal", "action", and "meta_action".
  2. Do NOT add any explanations, additional fields, or text outside the JSON object.
  3. All fields must be present even if empty - use empty strings ("") for unused fields.
  4. For "meta_action", only use one of: "leave", "none", or "" (empty string).
  5. Do NOT use the old format with "action_type" and "argument" fields.
  
  RESPONSE STRUCTURE (YOU MUST USE THIS EXACT STRUCTURE):
  {{
    "speak": "string containing what you say verbally (or empty string)",
    "nonverbal": "string describing gestures/expressions (or empty string)",
    "action": "string describing physical actions (or empty string)",
    "meta_action": "leave|none|"
  }}
  
  EXAMPLES OF VALID RESPONSES:
  
  Example 1 - Speaking with gesture:
  {{
    "speak": "Let's go this way.",
    "nonverbal": "points to the road",
    "action": "",
    "meta_action": ""
  }}
  
  Example 2 - Only nonverbal:
  {{
    "speak": "",
    "nonverbal": "shrugs and raises eyebrows",
    "action": "",
    "meta_action": "none"
  }}
  
  Example 3 - Ending conversation:
  {{
    "speak": "It was great talking to you.",
    "nonverbal": "smiles politely",
    "action": "",
    "meta_action": "leave"
  }}
  
  Example 4 - Only action:
  {{
    "speak": "",
    "nonverbal": "",
    "action": "draws a map on the ground",
    "meta_action": ""
  }}