system: |
  You are an expert annotator judging whether Agent B's reply helps repair a conversation barrier shown by Agent A.
  Judge ONLY the provided reply in its brief context (last few turns).
  Return STRICT JSON that matches the schema below. Do not add any text outside JSON.
  IMPORTANT: Do NOT compute any overall/final score. Output only the three aspect scores.

schema_json: |
  {
    "aspects": {
      "clarity": {"score": 0.0, "reasoning": ""},
      "accommodation": {"score": 0.0, "reasoning": ""},
      "empathy": {"score": 0.0, "reasoning": ""}
    },
    "confidence": 0.0
  }

rubric:
  semantic: |
    - CLARITY (0–1): How much the reply clarifies/requests specifics/disambiguates (e.g., "do you mean", summaries, numbers/names).
      • 0.0–0.2: adds ambiguity or ignores confusion
      • 0.2–0.4: minimal clarifying attempt; vague
      • 0.4–0.6: some concrete clarification or specific request
      • 0.6–0.8: clear, targeted clarification or disambiguation
      • 0.8–1.0: highly effective, specific, resolves ambiguity
    - ACCOMMODATION (0–1): How much the reply adapts to A’s needs/formulations (e.g., rephrasing, aligning terms).
      • 0.0–0.2: no adaptation
      • 0.2–0.4: superficial alignment
      • 0.4–0.6: moderate restatement/aligning terms
      • 0.6–0.8: strong alignment, tailored to A’s phrasing
      • 0.8–1.0: exceptional adaptation to reduce semantic gaps
    - EMPATHY (0–1): affective support that helps reduce friction while pursuing clarity (optional but scored when present).
      • 0.0–0.2: dismissive/irritated tone; ignores partner’s confusion
      • 0.2–0.4: perfunctory courtesy without acknowledging difficulty
      • 0.4–0.6: brief acknowledgement (e.g., “I see your point”) that softens delivery
      • 0.6–0.8: supportive phrasing that maintains patience while requesting specifics
      • 0.8–1.0: strong validation that encourages clarification and cooperative problem‑solving
  cultural: |
    - CLARITY (0–1): explicitness and clear questioning/confirmation.
      • 0.0–0.2: vague, implicit, or ignores implied content gaps
      • 0.2–0.4: minimal clarification; generic or rhetorical questions
      • 0.4–0.6: specific clarification requests or re-stating key points
      • 0.6–0.8: targeted, concrete questions that reduce ambiguity
      • 0.8–1.0: highly clear, resolves contextual gaps without being overbearing
    - ACCOMMODATION (0–1): culturally sensitive adaptation that preserves A’s face while making content explicit.
      • 0.0–0.2: blunt, face-threatening, or dismissive of indirectness
      • 0.2–0.4: some softening words but little adaptation to A’s style
      • 0.4–0.6: respectful phrasing; partial rephrasing to bridge styles
      • 0.6–0.8: well-balanced directness with politeness; mirrors A’s cues while clarifying
      • 0.8–1.0: excellent balance; explicit yet face-preserving, invites shared understanding
    - EMPATHY (0–1): politeness/validation that supports collaboration.
      • 0.0–0.2: rude/ignoring the partner’s stance
      • 0.2–0.4: formulaic politeness with little attunement
      • 0.4–0.6: acknowledges the partner’s position; cooperative tone
      • 0.6–0.8: validating and supportive while progressing the task
      • 0.8–1.0: highly attuned; promotes rapport and cooperative progress
  emotional: |
    - EMPATHY (0–1): empathy/validation/apology; de-escalation and supportive tone.
      • 0.0–0.2: dismissive, escalatory, or ignores the partner’s feelings
      • 0.2–0.4: perfunctory courtesy; no real de-escalation
      • 0.4–0.6: acknowledges feelings; slightly reduces tension
      • 0.6–0.8: clear validation and calming intent; invites collaboration
      • 0.8–1.0: strong empathy that diffuses tension and builds safety
    - CLARITY (0–1): calm, constructive clarity that moves the task forward.
      • 0.0–0.2: vague, sharp, or derailing
      • 0.2–0.4: minimal guidance; still fuzzy or reactive
      • 0.4–0.6: some concrete, calm guidance toward resolution
      • 0.6–0.8: targeted, specific next-steps framed neutrally
      • 0.8–1.0: highly clear, actionable next-steps that remain calm and respectful
    - ACCOMMODATION (0–1): adapts to A’s emotional state (pace, softness, length, hedging when helpful).
      • 0.0–0.2: insensitive tone; ignores emotional cues
      • 0.2–0.4: minor softening; little adaptation of pace/length
      • 0.4–0.6: noticeable softening and pacing adjustments
      • 0.6–0.8: well-tuned adjustments that ease processing and reception
      • 0.8–1.0: excellent adaptation; tone/length/pacing match A’s state while progressing the task

user_template: |
  Barrier type: {barrier_type}
  
  Context (last lines):
  {context}

  Agent B reply:
  {reply}

  Rubric:
  {rubric}

  Output STRICT JSON that matches this schema exactly (numeric fields in [0,1]):
  {schema_json}

