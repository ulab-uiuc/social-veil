system: |
  You are an expert annotator judging whether Agent B's reply helps repair a conversation barrier shown by Agent A.
  Judge ONLY the provided reply in its brief context (last few turns).
  Return STRICT JSON that matches the schema below. Do not add any text outside JSON.
  IMPORTANT: Do NOT compute any overall/final score. Output only the three aspect scores.
  Scoring must be EVIDENCE-BASED. If there is no explicit evidence in the reply for a behavior, assign 1 for that aspect (do not award partial credit for generic enthusiasm or politeness alone).
  Confidence (0–1) guidance: choose a non-zero value based on evidence strength:
    • 0.2≈low: few/no explicit markers; high ambiguity; weak alignment
    • 0.5≈medium: some explicit markers; partial alignment; limited empathy
    • 0.8≈high: clear explicit markers; strong alignment; solid empathy
  You may output any value in [0,1], not only anchors; avoid always returning 0.0.

schema_json: |
  {
    "aspects": {
      "clarity": {"score": 1, "reasoning": ""},
      "accommodation": {"score": 1, "reasoning": ""},
      "empathy": {"score": 1, "reasoning": ""}
    },
    "confidence": 0.0
  }

rubric: |
  Use this single rubric for ALL barrier types. Score each aspect on a 1–5 Likert scale based only on explicit evidence in the reply.

  - CLARITY (1–5): Does the reply reduce ambiguity or move understanding forward?
    • Looks for: concrete clarification (WH-requests), checks for understanding, concise summaries, explicit names/numbers when relevant, or actionable next steps.
    ZERO-POINT TRIGGERS: If the reply has none of the above (no clear question/check/summary/specifics/next step), set clarity to 1–2.
    • 1: adds ambiguity or ignores confusion
    • 2: minimal attempt; vague or generic
    • 3: some specific clarification or concise summary
    • 4: clear, targeted clarification or disambiguation
    • 5: highly effective and specific; resolves the key uncertainty

  - ACCOMMODATION (1–5): Does the reply adapt form/content to the partner’s needs?
    • Looks for: rephrasing in partner’s terms, aligning terminology, adjusting detail/pace/structure, acknowledging constraints.
    ZERO-POINT TRIGGERS: If the reply only signals agreement/politeness without adapting content/form, set accommodation to 1–2.
    • 1: no adaptation to partner needs
    • 2: superficial alignment without substance
    • 3: moderate restatement/term alignment
    • 4: strong tailoring to partner’s phrasing or constraints
    • 5: excellent adaptation that measurably reduces mismatch

  - EMPATHY (1–5): Does the reply acknowledge the partner’s stance/feelings and maintain a constructive tone while pursuing clarity?
    • Looks for: explicit acknowledgement, validation, de‑escalation, cooperative framing.
    • 1: dismissive/irritated; ignores stance or feelings
    • 2: perfunctory courtesy
    • 3: brief acknowledgement that softens delivery
    • 4: supportive tone that encourages collaboration
    • 5: strong validation that builds safety while progressing the task

user_template: |
  Barrier type: {barrier_type}
  
  Context (last lines):
  {context}

  Agent B reply:
  {reply}

  Rubric:
  {rubric}

  Output STRICT JSON that matches this schema exactly (aspect scores must be integers in [1,5], confidence in [0,1]):
  {schema_json}

