[tool.poetry]
name = "socialveil"
version = "0.1.0"
description = "A research framework for evaluating social intelligence in LLM agents through communication barriers"
license = "MIT"
readme = "README.md"
packages = [
    { include = "socialveil" }
]

[tool.poetry.dependencies]
python = ">=3.11, <3.13"
mypy = "^1.8.0"
beartype = "^0.17.1"
pydantic = "^2.8.2"
agency-swarm = "*"
matplotlib = "*"
sentence-transformers = "*"
numpy = "<2.0.0"
nltk = "*"
rouge-score = "*"
bert-score = "*"
torch = "*"
litellm = "1.44.7"
anthropic = "*"
mistralai = "*"
openai = "1.74.0"
pypinyin = "*"
pyyaml = "^6.0.2"
setuptools = "^80.9.0"
scikit-learn = "^1.7.1"
datasets = "^4.0.0"
wandb = "^0.21.4"
simpledorff = "^0.0.2"
unsloth = {git = "https://github.com/unslothai/unsloth.git", extras = ["pt"]}
pandas = "^2.3.2"
seaborn = "^0.13.2"
scipy = "^1.16.2"

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.6.0"
nbmake = "^1.5.0"
types-setuptools = "^69.0.0.0"
ruff = "^0.3.0"
commitizen = "^3.14.1"
# Removed black and isort since we're using ruff

[tool.poetry.group.test.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.5"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
hypothesis = "^6.98.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "normal"
strict = true
plugins = ["pydantic.mypy"]
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=socialveil --cov-report=term-missing"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["socialveil"]
omit = ["tests/*", "**/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "raise ImportError",
    "except ImportError:",
]

[tool.codespell]
ignore-words-list = "dout, te, indicies, astroid"
skip = ["data", ".git", "*.pyc", "*.csv", "*.json"]
quiet-level = 3

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = ["E203", "E266", "E501"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.0.1"
tag_format = "v$version"
bump_message = "bump: version $current_version → $new_version"
version_files = [
    "pyproject.toml:version",
    "socialveil/__init__.py:__version__"
]

[[tool.poetry.source]]
name = "torchcpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"
